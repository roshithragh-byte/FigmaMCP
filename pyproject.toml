[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figma-mcp-server"
version = "0.1.0"
description = "Production-ready remote Model Context Protocol (MCP) server wrapping the Figma REST API over Streamable HTTP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "mcp>=1.25.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "starlette>=0.37.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "ruff>=0.5.0",
]

[project.scripts]
figma-mcp-server = "figma_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figma_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
